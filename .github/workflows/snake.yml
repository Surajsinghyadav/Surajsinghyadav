name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo (REQUIRED)
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Generate snake SVGs
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Surajsinghyadav
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3️⃣ Push to snake-game branch
      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-game
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
